# Carema-Kis-AI · Frigate P0 模板
# 摄像头到货后:填好 .env(CAM_IP/CAM_USER/CAM_PASSWORD/TAPO_CLOUD_PASSWORD)→ docker compose restart frigate
mqtt:
  host: mosquitto

go2rtc:
  streams:
    # 多机型并存:每机型一条流;go2rtc 懒连接,未被消费的机型定义放着无害。
    # 切换机型 = 改 .env 的 STREAM_NAME(cam_xiaomi | cam_tapo),Frigate 取流与 agent 喇叭推送同步切换。
    cam_xiaomi:
      # 小米智能摄像机 3 云台版(现有过渡机)。需 go2rtc ≥1.9.14(自定义二进制放本目录,命名 go2rtc);
      # 一条链路含视频+双向音频;HEVC;每次建连需外网向小米云取密钥。
      # 认证:先在 go2rtc WebUI(:1984)Add→Xiaomi 登录一次(token 自动存 go2rtc_homekit.yml);
      # URL 格式 = 数字userID:区域@IP(不是账号:密码!)
      - xiaomi://{FRIGATE_XIAOMI_USERID}:{FRIGATE_XIAOMI_REGION}@{FRIGATE_XIAOMI_IP}?did={FRIGATE_XIAOMI_DID}&model=chuangmi.camera.069a01
    cam_tapo:
      # Tapo C260(终选主推)/ C225:视频走 RTSP,喇叭走 tapo:// 双向通道。
      - rtsp://{FRIGATE_CAM_USER}:{FRIGATE_CAM_PASSWORD}@{FRIGATE_CAM_IP}:554/stream1
      - tapo://{FRIGATE_TAPO_CLOUD_PASSWORD}@{FRIGATE_CAM_IP}

cameras:
  hallway:
    enabled: true
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/{FRIGATE_ACTIVE_STREAM}
          input_args: preset-rtsp-restream
          roles: [detect, record]
    detect:
      width: 1280
      height: 720
      fps: 5
    objects:
      track: [person]
    # 装好后在 Frigate UI 画出卫生间门口区域,坐标回填(方案.md §4 的门内停留计时靠它):
    # zones:
    #   bathroom_door:
    #     coordinates: ...

detectors:
  cpu0:
    type: cpu    # P0 先 CPU 跑通;P1 换 ONNX/TensorRT(方案.md §3)

record:
  enabled: true
  continuous:
    days: 0
  motion:
    days: 2
snapshots:
  enabled: true
  retain:
    default: 2

# P1 开启人脸识别(先在 UI 上传孩子/家长照片各 20–30 张训练):
# face_recognition:
#   enabled: true
#   model_size: large
version: 0.17-0
