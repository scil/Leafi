services:
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "18830:1883"   # 宿主机用 18830:Windows 保留了 1848–1947 段,1883 绑不上
    volumes:
      - ./config/mosquitto:/mosquitto/config
      - mosquitto-data:/mosquitto/data

  frigate:
    image: ghcr.io/blakeblackshear/frigate:stable
    restart: unless-stopped
    depends_on:
      - mosquitto
    shm_size: "256mb"
    ports:
      - "15000:5000"      # Frigate UI / API(宿主 15000:Windows 保留段会漂移到 4905-5004,5000 绑不上)
      - "8554:8554"       # RTSP restream
      - "8555:8555/tcp"   # WebRTC
      - "8555:8555/udp"
      - "1984:1984"       # go2rtc API(agent 推喇叭音频用)
    volumes:
      - ./config/frigate:/config
      - ./cache:/cache:ro           # agent 生成的 TTS 音频,go2rtc 按容器内路径读取
      - frigate-media:/media/frigate
    environment:
      # 当前启用的机型流(与 agent 的 STREAM_NAME 共用一个变量,一处切换)
      - FRIGATE_ACTIVE_STREAM=${STREAM_NAME:-cam_xiaomi}
      # Tapo C260/C225 档
      - FRIGATE_CAM_IP=${CAM_IP:-192.168.1.50}
      - FRIGATE_CAM_USER=${CAM_USER:-frigate}
      - FRIGATE_CAM_PASSWORD=${CAM_PASSWORD:-change-me}
      - FRIGATE_TAPO_CLOUD_PASSWORD=${TAPO_CLOUD_PASSWORD:-change-me}
      # 小米机的 P2P 源在宿主 go2rtc(tools/go2rtc),容器内只中继,无需小米凭据变量。
      # 注意:此处新增任何 FRIGATE_* 变量时默认值必须非空(s6 with-contenv 丢空值 → go2rtc 配置替换 KeyError)
    # P1 启用 GPU 检测(Docker Desktop 需开 WSL2 GPU 支持)后取消注释:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  mosquitto-data:
  frigate-media:
