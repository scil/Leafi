<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>动作编辑 · Carema-Kis-AI</title>
<style>
:root{
  --ground:#F5F7F4; --surface:#fff; --sunk:#EFF2EE; --ink:#16211D; --ink-2:#495A53;
  --ink-3:#7C8A84; --line:#DBE2DC; --line-2:#C3CEC5;
  --mint:#0B6E4F; --mint-wash:#E3F1EA; --rust:#A0372A; --rust-wash:#F6E6E3; --amber:#9A6310;
  --mono:ui-monospace,Consolas,"Cascadia Mono",monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    --ground:#0D1411; --surface:#131C18; --sunk:#101815; --ink:#E4EBE7; --ink-2:#A2B0AA;
    --ink-3:#6E7C76; --line:#25322B; --line-2:#33443B;
    --mint:#55D2A2; --mint-wash:#12261E; --rust:#E4796A; --rust-wash:#2A1512; --amber:#E0A552;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);
  font:15px/1.65 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  padding:12px 20px;display:flex;align-items:center;gap:14px}
header h1{font-size:16px;font-weight:600;margin:0}
header .sub{font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.spacer{margin-left:auto}
button{font:inherit;font-size:14px;padding:7px 14px;border-radius:3px;cursor:pointer;
  border:1px solid var(--line-2);background:transparent;color:var(--ink)}
button:hover{border-color:var(--ink-3)}
button.primary{background:var(--mint);border-color:var(--mint);color:#fff;font-weight:500}
button.primary:disabled{opacity:.45;cursor:default}
button.danger{color:var(--rust);border-color:var(--rust)}
.wrap{display:grid;grid-template-columns:260px minmax(0,1fr);gap:20px;padding:20px;
  max-width:1180px;margin:0 auto;align-items:start}
@media (max-width:820px){.wrap{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:4px}
.list{padding:8px}
.item{padding:9px 11px;border-radius:3px;cursor:pointer;display:flex;align-items:center;gap:8px}
.item:hover{background:var(--sunk)}
.item.on{background:var(--mint-wash);color:var(--mint)}
.item .nm{font-weight:500}
.item .tm{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.item.off .nm,.item.off .tm{opacity:.45;text-decoration:line-through}
.item .bad{color:var(--rust);font-weight:700}
.form{padding:20px 22px}
fieldset{border:none;border-top:1px solid var(--line);margin:0 0 6px;padding:18px 0 4px}
fieldset:first-of-type{border-top:none;padding-top:0}
legend{font-size:12px;font-family:var(--mono);letter-spacing:.08em;color:var(--mint);padding:0}
.row{display:grid;grid-template-columns:130px minmax(0,1fr);gap:10px 14px;align-items:center;
  margin-bottom:10px}
.row>label{font-size:13.5px;color:var(--ink-2)}
.row .hint{grid-column:2;font-size:12px;color:var(--ink-3);margin-top:-4px}
input,select,textarea{font:inherit;font-size:14px;padding:6px 9px;border:1px solid var(--line-2);
  border-radius:3px;background:var(--surface);color:var(--ink);width:100%}
input[type=checkbox]{width:auto}
input:focus,select:focus,textarea:focus{outline:2px solid var(--mint);outline-offset:1px}
textarea{font-family:var(--mono);font-size:13px;line-height:1.6;resize:vertical}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px 18px}
.grid label{display:block;font-size:12.5px;color:var(--ink-2);margin-bottom:3px}
.grid .why{font-size:11.5px;line-height:1.5;color:var(--ink-3);margin-top:4px}
.grid .why b{color:var(--ink-2);font-weight:500}
.explain{background:var(--sunk);border-left:2px solid var(--mint);padding:10px 13px;
  margin:0 0 16px;font-size:13px;line-height:1.65;color:var(--ink-2)}
.explain b{color:var(--ink)}
.errs{background:var(--rust-wash);border:1px solid var(--rust);border-radius:3px;
  padding:12px 14px;margin:0 0 16px;font-size:14px;color:var(--rust)}
.errs ul{margin:6px 0 0;padding-left:20px}
.toast{position:fixed;right:20px;bottom:20px;background:var(--surface);border:1px solid var(--line-2);
  border-left:3px solid var(--mint);border-radius:3px;padding:11px 16px;font-size:14px;
  box-shadow:0 2px 10px rgba(0,0,0,.08);opacity:0;transform:translateY(6px);
  transition:opacity .2s,transform .2s;pointer-events:none}
.toast.show{opacity:1;transform:none}
.toast.err{border-left-color:var(--rust);color:var(--rust)}
.note{font-size:13px;color:var(--ink-3);margin:14px 0 0;padding-top:12px;border-top:1px solid var(--line)}
code{font-family:var(--mono);font-size:.9em;background:var(--sunk);padding:1px 5px;border-radius:3px}
</style>
</head>
<body>

<header>
  <h1>动作编辑</h1>
  <span class="sub" id="file">config/tasks.yml</span>
  <span class="spacer"></span>
  <span class="sub" id="dirty"></span>
  <button id="reload">重新读取</button>
  <button class="primary" id="save" disabled>保存</button>
</header>

<div class="wrap">
  <div class="card list" id="list"></div>
  <div class="card form" id="form"></div>
</div>

<div class="toast" id="toast"></div>

<script>
// 把术语翻译成人话。改判据时不用回去翻代码,也不用记 anchor 是什么意思。
const HELP = {
  verify: {
    pose_dwell: '<b>数动作、按秒计时。</b>摄像头盯着手的来回摆动累计秒数,人走进卫生间那段看不见的时间,'
      + '按"从门口消失到再出现"折算一部分补分。适合<b>有来回动作、要持续一两分钟</b>的事:刷牙、洗手。',
    vlm_burst: '<b>隔几秒拍一张,拍完一起交给本地模型判一次。</b>不计时、不看门内停留。'
      + '适合<b>几秒钟就完事、没有来回动作</b>的事:喝水、吃药。这类动作用计分器测永远是零分。',
    presence: '<b>只记录"人来了"</b>,不判断做了什么。用于还没调好判据、或本来就只想打个卡的动作。'
  },
  scorer: {
    anchor: ['手该靠近身体的哪儿',
      '刷牙的手在嘴边 → 选 <b>nose</b>(鼻子);洗手的手在腰前的盆边 → 选 <b>hip</b>(两侧髋部的中点)。选错了这个动作一秒都记不上。'],
    axis: ['手来回动的方向',
      '刷牙是上下 → <b>y</b>;洗手是左右搓 → <b>x</b>;拿不准就选 <b>both</b>(任一方向有来回都算)。'],
    near_k: ['"算靠近"的宽松度',
      '手到锚点的距离小于 <b>这个数 × 肩宽</b> 才算贴近。用肩宽做尺子是为了人走远走近都不影响。'
      + '刷牙 1.2、洗手 1.5。<b>调大更宽松</b>(路过挠个头也可能算)、<b>调小更严</b>(稍微偏一点就不算)。'],
    min_flips_per_s: ['每秒至少来回几次',
      '手上下(或左右)<b>掉头</b>的次数。刷牙大约每秒 2–5 次,所以门槛给 2.0。'
      + '举着不动的翻转次数是 0——这条就是把"发呆"和"喝水"挡在外面的判据。<b>调大更严</b>。'],
    window_s: ['回看多长一段来判断',
      '判断"在不在动"时往回看几秒。默认 2 秒:太短容易被一次抖动骗过,太长会把刚停下的也算成还在做。'],
    min_std: ['低帧率时:最小晃动幅度',
      '备用判据:帧率低于 8 时改看"晃动幅度",低于这个值 = 基本没动。'
      + '<b>注意:目前 agent 固定按 8 帧上报,这条走不到</b>,改了不影响线上,等接了真实帧率再说。'],
    max_std: ['低帧率时:最大晃动幅度',
      '高于这个值 = 人在大幅走动,不是站在原地做动作。和上面一条一起夹出一个"手在动但没走位"的区间。'
      + '同样只在低帧率分支生效,<b>当前不起作用</b>。'],
    noise_eps: ['多小的抖动忽略不计',
      '关键点识别本身有误差,像素级的抖动不该被当成一次真的移动。基本不用改。'],
    max_gap_s: ['两帧最多补多少秒',
      '中间掉帧或被挡住时,最多按这么久补进时长。默认 0.6 秒——防止断流三十秒被算成一直在刷。']
  },
  fields: {
    target_seconds: '总分线:<b>可见秒数 + 门内折算</b>要达到这个数才算完成。',
    min_visible_seconds: '这里面必须有多少秒是<b>摄像头亲眼看到</b>的。防止"进屋待着"就把分刷满。',
    inside_credit_cap: '人在门内那段是<b>推断</b>出来的,最多只折算这么多秒。'
      + '全程在镜头里的动作(比如洗手)填 <b>0</b>。',
    milestones: '刷到这些秒数时喊一句鼓励。要递增,而且别超过总分线,否则永远播不出来。',
    burst_frames: '一共拍几张交给模型。',
    burst_interval_s: '两张之间隔多久。第一张到最后一张跨度 = <b>(张数 − 1) × 间隔</b>'
      + '(默认 8 张 × 4 秒 = 28 秒),要盖住动作可能发生的范围。',
    vlm_kind: '内部标识,英文小写。用于归类与记录;<b>提问正文仍必须自己填</b>——'
      + '校验要求每个终裁动作都写明"不识别身份",填了同样的 kind 也不会自动套用内置提问。'
  }
};

let TASKS = [], META = {}, cur = 0, dirty = false, errors = {};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function toast(msg, isErr){
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'toast show' + (isErr ? ' err' : '');
  setTimeout(() => t.className = 'toast' + (isErr ? ' err' : ''), 2600);
}
function setDirty(v){
  dirty = v;
  $('#save').disabled = !v;
  $('#dirty').textContent = v ? '有未保存的改动' : '';
}

async function load(){
  const r = await fetch('/api/tasks');
  const d = await r.json();
  TASKS = d.tasks; META = d.meta;
  cur = Math.min(cur, TASKS.length - 1);
  errors = {};
  setDirty(false);
  render();
}

function blank(){
  return {
    name:'', title:'', verify:'pose_dwell', schedule:'', enabled:true,
    vlm_kind:'', prompt:'', scorer:Object.assign({}, META.presets.brush || {}),
    target_seconds:null, min_visible_seconds:null, inside_credit_cap:null,
    milestones:[30,60,90], burst_frames:8, burst_interval_s:4,
    phrases:{opening:[], retry:[], arrived:[]}
  };
}

function render(){ renderList(); renderForm(); }

function renderList(){
  const el = $('#list');
  el.innerHTML = TASKS.map((t, i) => {
    const bad = errors[t.name || '(未命名)'] ? '<span class="bad">!</span>' : '';
    return `<div class="item ${i===cur?'on':''} ${t.enabled?'':'off'}" data-i="${i}">
      <span class="nm">${esc(t.title || t.name || '(未命名)')}</span>${bad}
      <span class="tm">${esc(t.schedule || '—')}</span></div>`;
  }).join('') + `<div style="padding:10px 4px 4px;display:flex;gap:8px">
      <button id="add" style="flex:1">＋ 新动作</button>
      <button id="dup">复制</button></div>`;
  el.querySelectorAll('.item').forEach(n => n.onclick = () => { cur = +n.dataset.i; render(); });
  $('#add').onclick = () => { TASKS.push(blank()); cur = TASKS.length - 1; setDirty(true); render(); };
  $('#dup').onclick = () => {
    if (!TASKS[cur]) return;
    const c = JSON.parse(JSON.stringify(TASKS[cur]));
    c.name = (c.name || 'task') + '_copy'; c.title = (c.title || '') + ' 副本'; c.schedule = '';
    TASKS.push(c); cur = TASKS.length - 1; setDirty(true); render();
  };
}

function set(path, val){
  const t = TASKS[cur], k = path.split('.');
  if (k.length === 1) t[k[0]] = val; else t[k[0]][k[1]] = val;
  setDirty(true);
  if (path === 'title' || path === 'schedule' || path === 'enabled' || path === 'name') renderList();
}

function field(label, path, opts = {}){
  const t = TASKS[cur];
  const v = path.includes('.') ? t[path.split('.')[0]][path.split('.')[1]] : t[path];
  const ph = opts.placeholder ? ` placeholder="${esc(opts.placeholder)}"` : '';
  const type = opts.type || 'text';
  const inp = `<input type="${type}" data-p="${path}" value="${v === null || v === undefined ? '' : esc(v)}"${ph}${opts.step ? ` step="${opts.step}"` : ''}>`;
  return `<div class="row"><label>${label}</label>${inp}${opts.hint ? `<div class="hint">${opts.hint}</div>` : ''}</div>`;
}

function renderForm(){
  const t = TASKS[cur];
  const el = $('#form');
  if (!t){ el.innerHTML = '<p style="color:var(--ink-3)">左边点「＋ 新动作」开始。</p>'; return; }
  const g = META.globals, errs = errors[t.name || '(未命名)'];

  let h = '';
  if (errs) h += `<div class="errs"><b>这个动作还存不了:</b><ul>${errs.map(e => `<li>${esc(e)}</li>`).join('')}</ul></div>`;

  h += `<fieldset><legend>基本</legend>
    ${field('任务名 name','name',{placeholder:'wash_hands',hint:'小写字母/数字/下划线。数据库、话术、排程都用它当键,建好别改'})}
    ${field('标题','title',{placeholder:'饭前洗手',hint:'家长通知和播报里显示的名字'})}
    ${field('排程时刻','schedule',{placeholder:'11:50',hint:'HH:MM;留空 = 不排程,仍可用 --now 手动跑。<b>改这项要重启 agent</b>'})}
    <div class="row"><label>启用</label><div><input type="checkbox" data-p="enabled" ${t.enabled?'checked':''}></div></div>
  </fieldset>`;

  h += `<fieldset><legend>验证策略 · 怎么判断他做没做</legend>
    <div class="row"><label>verify</label>
      <select data-p="verify">${META.verifyModes.map(m => `<option value="${m}" ${t.verify===m?'selected':''}>${m}</option>`).join('')}</select>
    </div>
    <div class="explain">${HELP.verify[t.verify] || ''}</div>
  </fieldset>`;

  if (t.verify === 'pose_dwell'){
    const sf = META.scorerFields;
    const win = t.scorer.window_s ?? (META.presets.brush || {}).window_s ?? 2;
    h += `<fieldset><legend>计分判据 · 什么样的一帧才算数</legend>
      <div class="explain">每一帧要<b>同时</b>过两关才计入时长:<br>
        ① <b>手在不在该在的地方</b> —— 手腕离 anchor 够近(下面的 near_k 决定多近算近)<br>
        ② <b>手在不在做该做的事</b> —— 最近 ${win} 秒(window_s)里沿 axis 方向来回摆动够快(min_flips_per_s)<br>
        举着水杯不动的话第 ① 关过、第 ② 关不过,所以喝水一秒都不会被记成刷牙。</div>
      <div class="row"><label>套用预设</label>
        <select id="preset"><option value="">—</option>${Object.keys(META.presets).map(k => `<option value="${k}">${k}</option>`).join('')}</select>
        <div class="hint">先挑个最接近的预设,再微调。<code>brush</code>=手在嘴边上下动,<code>wash_hands</code>=手在腰前左右搓</div>
      </div>
      <div class="grid">${sf.map(f => {
        const v = t.scorer[f], hp = HELP.scorer[f] || [f, ''];
        const why = `<div class="why">${hp[1]}</div>`;
        const lab = `<label>${hp[0]} <span style="opacity:.55;font-family:var(--mono)">${f}</span></label>`;
        if (f === 'anchor') return `<div>${lab}<select data-p="scorer.anchor">${['nose','hip'].map(o => `<option ${v===o?'selected':''}>${o}</option>`).join('')}</select>${why}</div>`;
        if (f === 'axis') return `<div>${lab}<select data-p="scorer.axis">${['y','x','both'].map(o => `<option ${v===o?'selected':''}>${o}</option>`).join('')}</select>${why}</div>`;
        return `<div>${lab}<input type="number" step="0.01" data-p="scorer.${f}" value="${v ?? ''}">${why}</div>`;
      }).join('')}</div>
      <div class="note">留空 = 用内置默认值。前四项(anchor / axis / near_k / min_flips_per_s)决定成败,后面几项基本不用动。</div>
    </fieldset>`;

    h += `<fieldset><legend>达标阈值 · 做到什么程度算完成</legend>
      <div class="explain">最后算总分:<b>可见秒数 + min(门内秒数, 门内上限) ≥ 总分线</b>,
        并且<b>可见秒数本身</b>也要够。两道门槛都过,才会把画面交给本地模型做最后确认。</div>
      ${field('总分线 ≥','target_seconds',{type:'number',placeholder:g.target_active_seconds,hint:HELP.fields.target_seconds+' 留空 = 用全局默认 '+g.target_active_seconds+'s'})}
      ${field('最低可见 ≥','min_visible_seconds',{type:'number',placeholder:g.min_visible_active_seconds,hint:HELP.fields.min_visible_seconds+' 留空 = '+g.min_visible_active_seconds+'s'})}
      ${field('门内最多折算','inside_credit_cap',{type:'number',placeholder:g.inside_credit_cap,hint:HELP.fields.inside_credit_cap+' 留空 = '+g.inside_credit_cap+'s'})}
      ${field('里程碑','milestones',{placeholder:'30, 60, 90',hint:HELP.fields.milestones})}
    </fieldset>`;
  }

  if (t.verify === 'vlm_burst'){
    h += `<fieldset><legend>连拍 · 拍几张给模型看</legend>
      ${field('抓几张','burst_frames',{type:'number',hint:HELP.fields.burst_frames})}
      ${field('间隔秒','burst_interval_s',{type:'number',step:'0.5',hint:HELP.fields.burst_interval_s})}
    </fieldset>`;
  }

  if (t.verify !== 'presence'){
    h += `<fieldset><legend>终裁 · 让本地模型看几张图确认一下</legend>
      <div class="explain">前面的计分只认<b>动作形状</b>,分不清手里拿的是牙刷还是勺子。
        ${t.verify === 'pose_dwell' ? '所以时长达标后' : '所以'}会把画面交给<b>本机</b>的视觉模型问一句,它说不是就不算数。
        模型跑在自己电脑上(Ollama),<b>图片不出家门</b>。</div>
      ${field('vlm_kind','vlm_kind',{placeholder:'wash',hint:HELP.fields.vlm_kind})}
      <div class="row"><label>问它什么</label>
        <textarea rows="4" data-p="prompt" placeholder="判断画面中的孩子是否在洗手(手在水池前搓洗)。只判断动作,不要识别或猜测人物身份。按 JSON 输出。">${esc(t.prompt)}</textarea>
        <div class="hint"><b>必须写明「不要识别或猜测人物身份」</b>——这是红线:认人只能靠 Frigate 本地人脸,
          不能让模型去猜画面里是谁。没写会被拒绝保存。</div>
      </div></fieldset>`;
  }

  h += `<fieldset><legend>话术</legend>
    <div class="note" style="margin-top:0;border:none;padding-top:0">一行一句,播报时随机挑一条。配了 API key 时由 Claude 参考风格现编,没配就直接念这里的。</div>
    ${META.phraseKinds.map(k => `<div class="row"><label>${k}</label>
      <textarea rows="2" data-p="phrases.${k}" placeholder="${k==='opening'?'到点提醒的第一句':k==='retry'?'没来的第二次催促':k==='arrived'?'看到人之后':k==='milestone'?'中途鼓励':k==='done'?'达标收尾':'没达标时'}">${esc((t.phrases[k]||[]).join('\n'))}</textarea></div>`).join('')}
  </fieldset>`;

  h += `<div style="display:flex;gap:8px;margin-top:18px">
    <button class="danger" id="del">删除这个动作</button></div>`;

  el.innerHTML = h;

  el.querySelectorAll('[data-p]').forEach(n => {
    const p = n.dataset.p;
    n.onchange = () => {
      let v;
      if (n.type === 'checkbox') v = n.checked;
      else if (n.tagName === 'TEXTAREA' && p.startsWith('phrases.'))
        v = n.value.split('\n').map(s => s.trim()).filter(Boolean);
      else if (p === 'milestones')
        v = n.value.split(',').map(s => parseInt(s.trim(), 10)).filter(x => !isNaN(x));
      else if (n.type === 'number') v = n.value === '' ? null : Number(n.value);
      else v = n.value;
      set(p, v);
      if (p === 'verify' || p === 'scorer.window_s') renderForm();
    };
  });
  const ps = el.querySelector('#preset');
  if (ps) ps.onchange = () => {
    if (!ps.value) return;
    TASKS[cur].scorer = Object.assign({}, META.presets[ps.value]);
    setDirty(true); renderForm();
  };
  el.querySelector('#del').onclick = () => {
    if (!confirm(`删除「${t.title || t.name}」?保存后才真正写入文件。`)) return;
    TASKS.splice(cur, 1); cur = Math.max(0, cur - 1); setDirty(true); render();
  };
}

$('#save').onclick = async () => {
  const r = await fetch('/api/tasks', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({tasks: TASKS})
  });
  const d = await r.json();
  if (d.error){ toast(d.error, true); return; }
  if (d.ok === false){
    errors = d.errors;
    const first = Object.keys(errors)[0];
    const i = TASKS.findIndex(t => (t.name || '(未命名)') === first);
    if (i >= 0) cur = i;
    render();
    toast('有 ' + Object.keys(errors).length + ' 个动作没通过校验', true);
    return;
  }
  TASKS = d.tasks; errors = {}; setDirty(false); render();
  toast('已写入 config/tasks.yml');
};
$('#reload').onclick = () => {
  if (dirty && !confirm('有未保存的改动,重新读取会丢掉。继续?')) return;
  load();
};
window.onbeforeunload = e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } };

load();
</script>
</body>
</html>
