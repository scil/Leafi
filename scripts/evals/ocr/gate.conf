# The gate: TCP pass-through from the published host ports into the internal `tools` network. Inbound only.
worker_processes 1;
events { worker_connections 256; }

stream {
    resolver 127.0.0.11 valid=10s ipv6=off;
    server { listen 19300; set $u langfuse-web:3000; proxy_pass $u; }
    server { listen 19090; set $u minio:9000;        proxy_pass $u; }
    server { listen 19006; set $u phoenix:6006;      proxy_pass $u; }
    server { listen 19080; set $u label-studio:8080; proxy_pass $u; }
}
